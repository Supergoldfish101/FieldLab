<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair FieldLab offline files</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#142128;color:#d9e6dc;font:16px/1.7 system-ui}main{max-width:500px;padding:30px}h1{font-size:26px}p{color:#a5bab0}button,a{color:#e8bb8b}button{border:0;border-radius:6px;background:#d69663;color:#142128;padding:13px 18px;font:inherit;cursor:pointer}small{display:block;margin-top:20px;color:#93aea1}</style><main><h1>Repair offline files</h1><p>This rebuilds FieldLab’s cached app files. Your saved setups and workspace settings stay in this browser.</p><p>Connect to the internet first. After repair, sign in if requested and allow the app to become ready offline again.</p><button id="repair">Rebuild offline files</button><p><a href="./">Return to FieldLab</a></p><small id="status" role="status"></small></main><script>document.getElementById('repair').onclick=async()=>{const button=document.getElementById('repair'),status=document.getElementById('status');button.disabled=true;status.textContent='Rebuilding app files…';try{const scope=new URL('./',location.href).href;if('serviceWorker'in navigator)for(const registration of await navigator.serviceWorker.getRegistrations())if(registration.scope===scope)await registration.unregister();if('caches'in window)await Promise.all((await caches.keys()).filter(key=>key.startsWith('fieldlab-')).map(key=>caches.delete(key)));location.replace('./');}catch{status.textContent='Repair could not finish. Connect to the internet and try again.';button.disabled=false;}};</script></html>
